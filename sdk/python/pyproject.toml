[project]
name = "perma-sdk"
version = "0.1.0"
description = "Python SDK for the PERMA prototype: read the funds, trade in their order books, run and use vaults."
requires-python = ">=3.10"
dependencies = ["web3>=7,<9", "eth-account>=0.13"]

[tool.setuptools.packages.find]
include = ["perma*"]

[tool.setuptools.package-data]
perma = ["abi.json"]
